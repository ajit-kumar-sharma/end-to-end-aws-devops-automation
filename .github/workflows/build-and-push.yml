name: Build and Push Docker Image

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: octabyte-staging-app

jobs:
  build-and-push:
    name: Build, Scan and Push
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: app
        run: npm ci

      # 4. Run tests
      - name: Run tests
        working-directory: app
        run: npm test

      # 5. Build Docker image
      - name: Build Docker image
        working-directory: app
        run: |
          docker build \
            -t octabyte-app:${{ github.sha }} \
            .

      # 6. Scan Docker image
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: octabyte-app:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # 7. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 8. Verify AWS connection
      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      # 9. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 10. Push Docker image to ECR
      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            octabyte-app:${IMAGE_TAG} \
            ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

          docker push \
            ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

          echo "Docker image pushed successfully!"
